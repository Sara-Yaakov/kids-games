<section class="panel mx-auto grid max-w-4xl animate-pop-in overflow-hidden bg-card md:grid-cols-2">
  <!-- Poster side -->
  <div
    class="relative flex min-h-56 flex-col justify-end overflow-hidden border-b-[3px] border-ink p-8 md:border-b-0 md:border-e-[3px]"
    [class]="mode() === 'login' ? 'bg-teal text-card' : 'bg-magenta text-card'"
  >
    <div class="deco absolute -top-10 -left-10 size-48 rounded-full border-[3px] border-ink bg-orange" aria-hidden="true"></div>
    <div class="deco absolute top-16 left-28 size-16 rotate-12 rounded-lg border-[3px] border-ink bg-card" aria-hidden="true">
      <span class="emoji grid size-full place-items-center text-4xl">{{ mode() === 'login' ? '👋' : '🚀' }}</span>
    </div>
    <h1 class="display relative text-7xl sm:text-8xl">
      @if (mode() === 'login') {
        איזה כיף<br />שחזרתם!
      } @else {
        יוצאים<br />להרפתקה!
      }
    </h1>
    <p class="relative mt-3 text-lg">
      {{ mode() === 'login' ? 'היכנסו כדי להמשיך לצבור נקודות.' : 'בוחרים שם גיבור וסיסמה סודית, וזהו.' }}
    </p>
  </div>

  <!-- Form side -->
  <div class="p-6 sm:p-8" [class.animate-shake]="shake()">
    <div class="grid grid-cols-2 rounded-xl border-[3px] border-ink p-1" role="tablist">
      @for (tab of tabs; track tab.id) {
        <button
          type="button"
          role="tab"
          class="rounded-lg py-2 text-lg font-bold transition-colors"
          [class]="mode() === tab.id ? 'bg-ink text-paper' : 'hover:bg-paper-deep'"
          [attr.aria-selected]="mode() === tab.id"
          (click)="setMode(tab.id)"
        >
          {{ tab.label }}
        </button>
      }
    </div>

    <form class="mt-6 flex flex-col gap-5" (ngSubmit)="submit()">
      <label class="flex flex-col gap-1.5">
        <span class="font-bold">שם משתמש</span>
        <input
          name="username"
          class="field"
          autocomplete="username"
          required
          maxlength="20"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
        />
      </label>

      <label class="flex flex-col gap-1.5">
        <span class="font-bold">סיסמה</span>
        <input
          name="password"
          type="password"
          class="field"
          required
          [attr.autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />
        @if (mode() === 'register') {
          <span class="text-sm">לפחות 4 תווים. כדאי לבחור משהו שקל לזכור.</span>
        }
      </label>

      @if (error()) {
        <p class="animate-pop-in rounded-xl border-[3px] border-ink bg-magenta-soft px-4 py-2 font-semibold" role="alert">
          {{ error() }}
        </p>
      }

      <button
        type="submit"
        class="btn mt-1 w-full py-4 text-xl"
        [class]="mode() === 'login' ? 'btn-teal' : 'btn-magenta'"
        [disabled]="loading() || !username() || !password()"
      >
        @if (loading()) {
          רגע...
        } @else if (mode() === 'login') {
          נכנסים <span aria-hidden="true">←</span>
        } @else {
          יוצרים משתמש <span aria-hidden="true">←</span>
        }
      </button>
    </form>
  </div>
</section>
