@if (auth.user(); as user) {
  <section class="flex animate-pop-in flex-wrap items-end justify-between gap-6">
    <div>
      <span class="sticker bg-orange-soft">{{ greeting() }}</span>
      <h1 class="display mt-4 text-7xl sm:text-9xl">
        היי, <span class="text-magenta">{{ user.username }}</span>
      </h1>
      <p class="mt-2 text-2xl">מה משחקים היום?</p>
    </div>

    <div class="panel flex items-center gap-4 bg-orange px-6 py-4">
      <span class="emoji text-5xl" aria-hidden="true">⭐</span>
      <div>
        <div class="display text-7xl">{{ user.total }}</div>
        <div class="font-semibold">נקודות עד עכשיו</div>
      </div>
    </div>
  </section>

  <section class="mt-12 grid gap-8 md:grid-cols-2" aria-label="משחקים">
    @for (game of games; track game.id; let i = $index) {
      <app-game-card class="animate-pop-in" [style.animation-delay.ms]="i * 100" [game]="game">
        <div class="mt-4 flex items-baseline gap-2 rounded-xl border-2 border-dashed border-ink/40 px-3 py-2">
          <span class="display text-4xl">{{ user.scores[game.id] }}</span>
          <span class="font-semibold">נקודות במשחק הזה</span>
        </div>
      </app-game-card>
    }
  </section>

  <app-leaderboard class="mt-20 block" />
}
