<app-game-hud
  title="בלונים מוזיקליים"
  emoji="🎸"
  progressLabel="בלון {{ index() + 1 }} מתוך {{ total }}"
  [score]="session.score()"
  [streak]="session.streak()"
  [current]="index()"
  [total]="total"
/>

<app-praise-toast
  [message]="session.toast().message"
  [tone]="session.toast().tone"
  [key]="session.toast().key"
/>

@if (session.finished()) {
  <app-game-over
    game="instruments"
    [score]="session.score()"
    [accuracy]="session.accuracy()"
    (playAgain)="start()"
  />
} @else {
  @let r = round();
  @for (i of [index()]; track i) {
    <section class="mt-6 flex animate-pop-in flex-col items-center gap-3 text-center">
      @if (r.byEar) {
        <span class="rounded-full bg-tangerine px-4 py-1 text-lg font-bold text-white">👂 אתגר האוזן!</span>
        <h2 class="text-outline text-3xl font-bold text-white sm:text-5xl">איזה כלי מנגן עכשיו?</h2>
        <button type="button" class="btn-3d border-berry bg-bubblegum text-white" (click)="announce()">
          🔊 נגנו לי שוב
        </button>
      } @else {
        <h2 class="text-outline text-3xl font-bold text-white sm:text-5xl">
          פוצצו את ה<span class="text-sunny">{{ r.target.name }}</span>!
        </h2>
        <button type="button" class="btn-3d border-grape bg-white text-grape" (click)="hear(r.target)">
          🎵 איך {{ r.target.name }} נשמע?
        </button>
      }
    </section>

    <section class="stage relative mt-4 grid grid-cols-2 place-items-end gap-4 sm:grid-cols-4" aria-label="בלונים">
      @for (b of balloons(); track b.instrument.id) {
        @let id = b.instrument.id;
        <button
          type="button"
          class="balloon-wrap"
          [class.popped]="popped() === id"
          [class.deflated]="deflated().has(id)"
          [style.--rise-delay]="b.delay + 's'"
          [style.--bob-delay]="-b.delay * 3 + 's'"
          [attr.aria-label]="r.byEar ? 'בלון ' + ($index + 1) : b.instrument.name"
          (click)="pop(b, $any($event.currentTarget))"
        >
          <span class="balloon" [style.--c]="b.color">
            <span class="emoji text-6xl drop-shadow sm:text-7xl">{{ b.instrument.emoji }}</span>
          </span>
          <span class="string"></span>
          @if (popped() === id || deflated().has(id)) {
            <span class="label animate-pop-in">{{ b.instrument.name }}</span>
          }
        </button>
      }
    </section>
  }
}
