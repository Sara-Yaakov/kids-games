<app-game-hud
  title="בלונים מוזיקליים"
  emoji="🎸"
  tone="magenta"
  progressLabel="בלון {{ index() + 1 }} מתוך {{ total }}"
  [score]="session.score()"
  [streak]="session.streak()"
  [current]="index()"
  [total]="total"
/>

<app-praise-toast
  [message]="session.toast().message"
  [tone]="session.toast().tone"
  [key]="session.toast().key"
/>

@if (session.finished()) {
  <app-game-over
    game="instruments"
    [score]="session.score()"
    [accuracy]="session.accuracy()"
    (playAgain)="start()"
  />
} @else {
  @let r = round();
  @for (i of [index()]; track i) {
    <section class="mt-10 flex animate-pop-in flex-col items-center gap-4 text-center">
      @if (r.byEar) {
        <span class="sticker bg-orange text-base">אתגר האוזן 👂</span>
        <h2 class="display text-6xl sm:text-8xl">איזה כלי <span class="text-magenta">מנגן</span> עכשיו?</h2>
        <button type="button" class="btn btn-magenta" (click)="announce()">🔊 לשמוע שוב</button>
      } @else {
        <h2 class="display text-6xl sm:text-8xl">
          פוצצו את ה<span class="target">{{ r.target.name }}</span>
        </h2>
        <button type="button" class="btn btn-paper" (click)="hear(r.target)">🎵 איך {{ r.target.name }} נשמע?</button>
      }
    </section>

    <section class="stage relative mt-6 grid grid-cols-2 place-items-end gap-4 sm:grid-cols-4" aria-label="בלונים">
      @for (b of balloons(); track b.instrument.id) {
        @let id = b.instrument.id;
        <button
          type="button"
          class="balloon-wrap"
          [class.popped]="popped() === id"
          [class.deflated]="deflated().has(id)"
          [style.--rise-delay]="b.delay + 's'"
          [style.--bob-delay]="-b.delay * 3 + 's'"
          [attr.aria-label]="r.byEar ? 'בלון ' + ($index + 1) : b.instrument.name"
          (click)="pop(b, $any($event.currentTarget))"
        >
          <span class="balloon" [style.--c]="b.color">
            <span class="emoji text-7xl sm:text-8xl">{{ b.instrument.emoji }}</span>
          </span>
          <svg class="string" viewBox="0 0 20 80" aria-hidden="true">
            <path d="M10 0 C 2 20, 18 40, 10 60 S 6 75, 10 80" />
          </svg>
          @if (popped() === id || deflated().has(id)) {
            <span class="sticker label animate-pop-in bg-card text-xl">{{ b.instrument.name }}</span>
          }
        </button>
      }
    </section>
  }
}
