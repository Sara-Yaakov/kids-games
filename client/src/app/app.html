<app-floating-bg />

<header class="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 pt-4">
  <a routerLink="/" class="group flex items-center gap-2" (click)="sound.click()">
    <span class="emoji text-4xl transition-transform group-hover:animate-wiggle sm:text-5xl">🧠</span>
    <span class="text-outline text-2xl font-bold text-sunny sm:text-4xl">עולם החכמים</span>
  </a>

  <div class="flex items-center gap-2">
    @if (auth.user(); as user) {
      <div
        class="flex items-center gap-2 rounded-2xl border-b-[6px] border-tangerine bg-sunny px-3 py-2 text-lg font-bold sm:text-xl"
        title="סך כל הנקודות"
      >
        <span class="emoji animate-bounce-soft">⭐</span>
        <span>{{ user.total }}</span>
        <span class="hidden max-w-32 truncate border-s-2 border-ink/20 ps-2 font-medium sm:inline">{{ user.username }}</span>
      </div>
      <button
        type="button"
        class="btn-3d border-grape/60 bg-white px-3 py-2 text-lg"
        aria-label="יציאה"
        (click)="auth.logout()"
      >
        <span class="emoji">🚪</span>
      </button>
    }
    <button
      type="button"
      class="btn-3d border-grape/60 bg-white px-3 py-2 text-2xl"
      [attr.aria-label]="sound.muted() ? 'הפעלת צלילים' : 'השתקת צלילים'"
      (click)="sound.toggleMute()"
    >
      <span class="emoji">{{ sound.muted() ? '🔇' : '🔊' }}</span>
    </button>
  </div>
</header>

<main class="mx-auto max-w-6xl px-4 pt-6 pb-16">
  <router-outlet />
</main>
